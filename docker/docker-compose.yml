x-postgres-common: &postgres-common
  runtime: ${PG_STACK_DOCKER_RUNTIME:-runc}
  environment:
    POSTGRES_PASSWORD: postgres
  volumes:
    - ../../:/workspace
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  postgres-pg14:
    <<: *postgres-common
    profiles: ["pg14"]
    build: {context: .., dockerfile: docker/Dockerfile.pg14}
    ports: ["5414:5432"]
  postgres-pg15:
    <<: *postgres-common
    profiles: ["pg15"]
    build: {context: .., dockerfile: docker/Dockerfile.pg15}
    ports: ["5415:5432"]
  postgres-pg16:
    <<: *postgres-common
    profiles: ["pg16"]
    build: {context: .., dockerfile: docker/Dockerfile.pg16}
    ports: ["5416:5432"]
  postgres-pg17:
    <<: *postgres-common
    profiles: ["pg17"]
    build: {context: .., dockerfile: docker/Dockerfile.pg17}
    ports: ["5417:5432"]
  postgres-pg18:
    <<: *postgres-common
    profiles: ["pg18"]
    build: {context: .., dockerfile: docker/Dockerfile.pg18}
    ports: ["5418:5432"]
