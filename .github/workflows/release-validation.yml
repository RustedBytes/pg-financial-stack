name: Release validation
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Extension name, for example pg_ledger
        required: true
      reference:
        description: Candidate Git tag, branch, or commit
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [pg14, pg15, pg16, pg17, pg18]
    steps:
      - uses: actions/checkout@v4
      - name: Set candidate override and run
        env:
          CANDIDATE: ${{ inputs.candidate }}
          REFERENCE: ${{ inputs.reference }}
        run: |
          variable="PG_STACK_$(echo "$CANDIDATE" | tr '[:lower:]-' '[:upper:]_')_REF"
          export "$variable=$REFERENCE"
          scripts/docker-test.sh '${{ matrix.pg }}' full git
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.pg }}
          path: stack/versions.lock

