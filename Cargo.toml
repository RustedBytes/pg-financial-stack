[workspace]
members = ["bench"]
exclude = [
  ".stack/extensions/pg_money",
  ".stack/extensions/pg_cryptocurrency",
  ".stack/extensions/pg_fx",
  ".stack/extensions/pg_ledger",
  ".stack/extensions/pg_reconcile",
  ".stack/extensions/pg_risk",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/RustedBytes/pg-financial-stack"
